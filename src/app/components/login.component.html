<p-toast position="top-center"></p-toast>
<div class="flex justify-content-center align-items-center h-screen">
  <p-card styleClass="w-25rem pt-3 shadow-4">

    <!-- Header / Logo con evento (Easter egg) -->
    <ng-template #header>
      <div class="flex flex-column align-items-center justify-content-center pt-4" style="user-select: none;">
        <!-- El div interno funge como el "logo" que espera de los 5 clics -->
        <div (click)="onLogoClick()" class="cursor-pointer flex align-items-center justify-content-center border-circle bg-primary-50 text-primary" style="width: 60px; height: 60px;">
          <i class="pi pi-box text-3xl"></i>
        </div>
        <h1 class="text-2xl font-bold mt-3 mb-0 text-900 text-center">ERP System</h1>
        <span class="text-500 text-sm mt-1 text-center">Inicia sesión en tu cuenta</span>
      </div>
    </ng-template>

    <form [formGroup]="form" (ngSubmit)="login()">

      <div class="field">
        <label>Email</label>
        <input pInputText formControlName="email" class="w-full">
        <small class="text-red-500 block mt-1"
          *ngIf="form.get('email')?.invalid && (form.get('email')?.dirty || form.get('email')?.touched)">
          <span *ngIf="form.get('email')?.errors?.['required']">El email es obligatorio.</span>
          <span *ngIf="form.get('email')?.errors?.['email']">El formato del email no es válido.</span>
        </small>
      </div>

      <div class="field">
        <label>Password</label>
        <p-password formControlName="password" styleClass="w-full" [inputStyle]="{'width': '100%'}" [feedback]="false"
          [toggleMask]="true"></p-password>
        <small class="text-red-500 block mt-1"
          *ngIf="form.get('password')?.invalid && (form.get('password')?.dirty || form.get('password')?.touched)">
          El password es obligatorio.
        </small>
      </div>

      <p-button label="Entrar" type="submit" class="w-full" [disabled]="form.invalid"></p-button>

      <div class="mt-3 text-center">
        <small>¿No tienes cuenta? <a routerLink="/register" class="text-primary font-bold cursor-pointer"
            style="text-decoration: none;">Regístrate</a></small>
      </div>

      <div class="mt-3 text-center">
        <small class="text-red-500" *ngIf="error">{{ error }}</small>
      </div>

    </form>

  </p-card>
</div>
